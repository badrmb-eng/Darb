<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Slide · Darb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: bright, bouncy kids' arcade, Darb slide mode
   IDEA: a toy-box Bahrain where rooftops, souq awnings, streets and pipes are one big slide
   PICTURE: the live 3D game fills the screen; Fofo the baby dugong (or Jojo the pufferfish) is the star
   COLOUR and TYPE: sky blue, sand, sea turquoise, pearl white, coral accent; Baloo Bhaijaan 2
   LAYOUT: full-screen canvas, pill HUD on top, rounded cards for level select and finish */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#8fd3ff;font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;color:#13324a;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;padding:max(12px,env(safe-area-inset-top)) 14px 0;pointer-events:none;opacity:0;transition:opacity .4s}
#hud.on{opacity:1}
.pill{display:flex;align-items:center;gap:8px;background:#ffffffe6;border-radius:999px;padding:4px 14px 4px 6px;font-weight:800;font-size:22px;box-shadow:0 3px 0 #0b5a8a33}
.pearl{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#f7ecf0 40%,#d9c6d4 100%);box-shadow:inset -2px -3px 4px #b9a2b6;flex:none}
.prog{flex:1;height:14px;background:#ffffffb3;border-radius:999px;position:relative;box-shadow:0 3px 0 #0b5a8a33}
#pb{position:absolute;inset:0 auto 0 0;width:0;background:#ff7a59;border-radius:999px}
#dot{position:absolute;top:50%;left:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#5f93bf;border:3px solid #fff}
#dot:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#13324a;top:8px;left:6px;box-shadow:10px 0 #13324a}
.goal{width:30px;height:30px;border-radius:50%;background:#27c3d8;border:3px solid #fff;flex:none}
#mute{pointer-events:auto;width:44px;height:44px;border:0;border-radius:50%;background:#ffffffe6;font:800 20px inherit;color:#13324a;box-shadow:0 3px 0 #0b5a8a33}
.panel{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100vw - 24px));max-height:calc(100dvh - 36px);overflow:auto;background:#fffffff2;border-radius:28px;padding:18px 18px 16px;text-align:center;box-shadow:0 8px 0 #0b5a8a40;transition:transform .35s,opacity .35s}
.panel.hide{opacity:0;transform:translate(-50%,40px);pointer-events:none}
h1{font-size:36px;line-height:1.02;font-weight:800;color:#0e4f7a}
.ar{font-size:24px;font-weight:800;color:#ff7a59;margin-top:2px}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.lv{position:relative;border:0;border-radius:20px;padding:10px 8px 8px;min-height:112px;font-family:inherit;color:#fff;cursor:pointer;box-shadow:0 5px 0 #0003;text-align:center;overflow:hidden}
.lv:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
.lv:focus-visible{outline:3px solid #0e4f7a;outline-offset:3px}
.lv .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#ffffffe0;color:#0e4f7a;font-weight:800;font-size:20px}
.lv .t{display:block;font-weight:800;font-size:17px;line-height:1.1;margin-top:4px}
.lv .a{display:block;font-weight:800;font-size:15px;opacity:.95}
.lv .s{display:block;font-size:17px;letter-spacing:2px;color:#ffe066;line-height:1.2}
.lv .s i{font-style:normal;color:#ffffff66}
.lv .lock{position:absolute;inset:0;background:#0e2c40cc;display:grid;place-content:center;gap:2px;font-size:13px;line-height:1.25;padding:6px}
.lv .lock b{font-size:26px;line-height:1}
.sub{font-size:16px;margin:6px 0 4px;color:#2e5a75;line-height:1.35}
.go{display:block;width:100%;min-height:54px;border:0;border-radius:20px;background:#ff7a59;color:#fff;font:800 23px "Baloo Bhaijaan 2",sans-serif;box-shadow:0 6px 0 #c9502f;cursor:pointer;margin-top:10px}
.go.b{background:#2d8fd5;box-shadow:0 6px 0 #1c6aa3}
.go.w{background:#eaf6fd;color:#0e4f7a;box-shadow:0 6px 0 #c3dceb}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
.go:focus-visible,#mute:focus-visible{outline:3px solid #0e4f7a;outline-offset:3px}
.row{display:flex;gap:10px}.row .go{flex:1}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 2px}
.pick button{display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 10px;border:3px solid #0e4f7a;border-radius:16px;background:#fff;color:#0e4f7a;font:800 17px/1.1 "Baloo Bhaijaan 2",sans-serif;cursor:pointer;text-align:start}
.pick button small{display:block;font-weight:600;font-size:14px}
.pick button[aria-pressed=true]{background:#ffe9a8;box-shadow:0 4px 0 #0e4f7a}
.pick .av{width:34px;height:30px;flex:none;border:3px solid #163447;border-radius:50% 50% 45% 45%;position:relative}
.pick .av:before,.pick .av:after{content:'';position:absolute;top:7px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:inset 1px 1px 0 2px #163447}.pick .av:before{left:6px}.pick .av:after{right:6px}
.hint{display:flex;justify-content:center;gap:14px;margin-top:8px;font-size:14px;color:#4b7590;flex-wrap:wrap}
.hint b{color:#0e4f7a}
.link{border:0;background:none;color:#7c97a8;font:13px inherit;text-decoration:underline;margin-top:6px;min-height:32px;cursor:pointer}
.tag{font-size:12px;color:#7c97a8}
.stars{font-size:46px;letter-spacing:6px;color:#ffc531;text-shadow:0 3px 0 #d99a00;line-height:1.1;margin:4px 0}
.stars i{font-style:normal;color:#d7e3ea;text-shadow:0 3px 0 #b8c9d3}
.res{display:flex;justify-content:center;gap:10px;margin:6px 0 4px}
.res div{background:#eaf6fd;border-radius:16px;padding:6px 14px;font-size:15px;color:#4b7590}
.res b{display:block;font-size:24px;color:#0e4f7a;line-height:1.1}
#unl{font-size:15px;color:#2e8a4e;font-weight:800;min-height:20px}
#pops{position:fixed;inset:0;pointer-events:none;display:grid;place-items:center}
.pop{position:absolute;top:30%;font-weight:800;font-size:44px;color:#fff;-webkit-text-stroke:2px #0e4f7a;text-shadow:0 5px 0 #0e4f7a;animation:pop 1s ease-out forwards;text-align:center;line-height:1}
.pop small{display:block;font-size:24px;-webkit-text-stroke:1px #0e4f7a;text-shadow:0 3px 0 #0e4f7a}
.pop.big{font-size:34px;top:22%}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}18%{transform:scale(1.15) rotate(3deg);opacity:1}35%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="c" aria-label="The Slide game"></canvas>
<div id="hud"><div class="pill"><span class="pearl"></span><b id="pc">0</b></div><div class="prog"><div id="pb"></div><span id="dot"></span></div><span class="goal"></span><button id="mute" aria-label="Sound on or off">&#9835;</button></div>
<div id="pops"></div>
<div id="flash"></div>
<div class="panel" id="start">
  <h1>The Slide</h1>
  <div class="ar" dir="rtl">الزلّاقة</div>
  <div class="pick" id="pick"><button data-c="fofo"><span class="av" style="background:#5f93bf"></span><span>Fofo<small dir="rtl">فوفو</small></span></button><button data-c="puff"><span class="av" style="background:#e25a48;border-radius:50%"></span><span>Jojo<small dir="rtl">جوجو</small></span></button></div>
  <div class="lvls" id="levels"></div>
  <div class="hint"><span><b>Swipe</b> to steer</span><span><b>Tap</b> to jump</span><span><b>Grab</b> pearls</span></div>
  <div class="tag">Get 8 out of 10 in a Darb lesson to open each level.<br><span dir="rtl">جاوب ٨ من ١٠ في دروس دَرب عشان تفتح المراحل.</span></div>
  <a class="go w" href="index.html" style="display:block;text-decoration:none;line-height:54px;padding:0">&#9664; Back to Darb · رجوع</a>
</div>
<div class="panel hide" id="end">
  <h1>Home!</h1>
  <div class="ar" dir="rtl" id="homeAr">وصل فوفو البيت!</div>
  <div class="stars" id="stars"></div>
  <div class="res"><div><b id="rp">0</b>pearls</div><div><b id="rt">0s</b>time</div><div><b id="rb">0</b>bumps</div></div>
  <div id="unl"></div>
  <button class="go" id="next">Next level &#9654; التالي</button>
  <div class="row"><button class="go b" id="again">Again &#8635; مرة ثانية</button><button class="go w" id="menu">Levels</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const cvs=$('c');
const R=new THREE.WebGLRenderer({canvas:cvs,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const FOG=new THREE.Fog(0xc4ebff,150,750),FOGPIPE=new THREE.Fog(0x0a3346,4,85);
scene.fog=FOG;
const cam=new THREE.PerspectiveCamera(68,1,.1,2600);
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
addEventListener('pageshow',()=>{if(typeof renderLevels==='function')renderLevels();});

let seed=11;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const gm=new THREE.DataTexture(new Uint8Array([95,165,225]),3,1,THREE.LuminanceFormat);
gm.minFilter=gm.magFilter=THREE.NearestFilter;gm.generateMipmaps=false;gm.needsUpdate=true;
const MC={};
function M(c,o){if(!o&&MC[c])return MC[c];const m=new THREE.MeshToonMaterial(Object.assign({color:c,gradientMap:gm},o||{}));if(!o)MC[c]=m;return m;}
const OL=new THREE.MeshBasicMaterial({color:0x163447,side:THREE.BackSide});
function CT(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;}
function rep(t,x,y){const n=t.clone();n.needsUpdate=true;n.repeat.set(x,y);return n;}
const winT=CT(128,128,(x,w,h)=>{x.fillStyle='#fff';x.fillRect(0,0,w,h);x.fillStyle='#e7dccb';x.fillRect(0,112,w,16);x.fillStyle='#86bcd8';x.fillRect(30,26,68,64);x.fillStyle='#b8dcef';x.fillRect(34,30,28,26);x.fillStyle='#d6c9b4';x.fillRect(24,90,80,8);});
const litT=CT(128,128,(x,w,h)=>{x.fillStyle='#000';x.fillRect(0,0,w,h);x.fillStyle='#ffd36b';x.fillRect(30,26,68,64);});
const roofT=CT(128,128,(x,w,h)=>{x.fillStyle='#e6cfa6';x.fillRect(0,0,w,h);x.strokeStyle='#d2b88c';x.lineWidth=3;x.strokeRect(0,0,w,h);x.fillStyle='#dcc296';for(let i=0;i<40;i++)x.fillRect(Math.random()*w,Math.random()*h,3,3);});
const tileT=CT(64,64,(x,w,h)=>{x.fillStyle='#fff';x.fillRect(0,0,w,h);x.fillStyle='#c9dde6';x.fillRect(0,0,w,3);x.fillRect(0,0,3,h);});
const checkT=CT(64,64,(x,w,h)=>{x.fillStyle='#f7f7f2';x.fillRect(0,0,w,h);x.fillStyle='#2b3440';x.fillRect(0,0,32,32);x.fillRect(32,32,32,32);});
const chevT=CT(128,64,(x,w,h)=>{x.fillStyle='#ffc531';x.fillRect(0,0,w,h);x.fillStyle='#2b3440';for(let i=-1;i<5;i++){x.beginPath();x.moveTo(i*32,64);x.lineTo(i*32+16,64);x.lineTo(i*32+40,0);x.lineTo(i*32+24,0);x.fill();}});
const pipeT=CT(64,256,(x,w,h)=>{x.fillStyle='#fff';x.fillRect(0,0,w,h);x.fillStyle='#d6eef3';x.fillRect(0,0,w,40);x.fillStyle='#b4d6de';x.fillRect(0,200,w,18);x.fillStyle='#f2fbfd';for(let i=0;i<6;i++)x.fillRect(8+i*9,120,4,30);});
const roadT=CT(128,64,(x,w,h)=>{x.fillStyle='#5c6370';x.fillRect(0,0,w,h);x.fillStyle='#ffd24a';x.fillRect(0,29,56,6);});
const roadZT=CT(64,128,(x,w,h)=>{x.fillStyle='#5c6370';x.fillRect(0,0,w,h);x.fillStyle='#ffffff';x.fillRect(29,0,6,56);});
const latT=CT(64,64,(x,w,h)=>{x.fillStyle='#7a4f2e';x.fillRect(0,0,w,h);x.fillStyle='#a87448';for(let i=0;i<4;i++)for(let j=0;j<4;j++)x.fillRect(4+i*16,4+j*16,9,9);});
const grateT=CT(64,64,(x,w,h)=>{x.fillStyle='#3a414b';x.fillRect(0,0,w,h);x.fillStyle='#111';for(let i=0;i<6;i++)x.fillRect(6+i*10,6,5,52);});
const STR={};function stripeT(a,b){const k=a+b;if(!STR[k])STR[k]=CT(64,64,(x,w,h)=>{x.fillStyle=a;x.fillRect(0,0,w,h);x.fillStyle=b;x.fillRect(0,0,32,h);});return STR[k];}

// sky, sun, clouds, stars (shared)
const skyU={top:{value:new THREE.Color(.22,.6,.98)},bot:{value:new THREE.Color(.77,.92,1)}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(2400,32,16),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform vec3 top;uniform vec3 bot;varying vec3 vP;void main(){float h=normalize(vP).y;gl_FragColor=vec4(mix(bot,top,smoothstep(0.,.45,h)),1.);}'}));
scene.add(sky);
const sunDisc=new THREE.Mesh(new THREE.CircleGeometry(70,40),new THREE.MeshBasicMaterial({color:0xfff3c4,fog:false}));scene.add(sunDisc);
const cloudM=new THREE.MeshBasicMaterial({color:0xffffff,fog:false}),cloudS=new THREE.MeshBasicMaterial({color:0xdcefff,fog:false});const clouds=new THREE.Group();scene.add(clouds);
for(let i=0;i<16;i++){const g=new THREE.Group();const n=4+Math.floor(rnd()*3);for(let j=0;j<n;j++){const s=new THREE.Mesh(new THREE.SphereGeometry(1,14,10),j%2?cloudS:cloudM);const r=10+rnd()*10;s.scale.set(r,r*.75,r);s.position.set(j*14-n*7,rnd()*6,rnd()*8);g.add(s);}const a=rnd()*Math.PI*2,d=500+rnd()*700;g.position.set(Math.cos(a)*d,110+rnd()*120,-400+Math.sin(a)*d-300);clouds.add(g);}
const stars=(()=>{const p=[];for(let i=0;i<500;i++){const a=rnd()*Math.PI*2,e=.08+rnd()*1.3;p.push(Math.cos(a)*Math.cos(e)*2000,Math.sin(e)*2000,Math.sin(a)*Math.cos(e)*2000);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));return new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:2.2,sizeAttenuation:false,fog:false}));})();scene.add(stars);
const hemi=new THREE.HemisphereLight(0xdff1ff,0xe6c48c,.62);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d4,.72);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-28,right:28,top:28,bottom:-28,near:1,far:160});sun.shadow.bias=-.0006;scene.add(sun,sun.target);
const THEMES={
 day:{top:[.22,.6,.98],bot:[.77,.92,1],fog:0xc4ebff,hemi:[0xdff1ff,0xe6c48c,.62],sun:[0xfff0d4,.72],disc:[0xfff3c4,500,420,-2000,70],sea:0x2cc6dc,night:0,cloud:[0xffffff,0xdcefff]},
 souq:{top:[.28,.6,.95],bot:[.99,.9,.74],fog:0xf3dfc0,hemi:[0xfff1dc,0xe6c48c,.62],sun:[0xffe2b0,.78],disc:[0xffe7a8,-600,380,-2000,75],sea:0x2cc6dc,night:0,cloud:[0xffffff,0xfff0d8]},
 sunset:{top:[.33,.3,.7],bot:[1,.62,.4],fog:0xf7a77e,hemi:[0xffd2b0,0xb88a6a,.66],sun:[0xffb070,.8],disc:[0xffcf5a,0,70,-2000,110],sea:0x2f9fc4,night:.45,cloud:[0xffc6a6,0xf59a8a]},
 night:{top:[.02,.05,.17],bot:[.1,.17,.38],fog:0x1b2a52,hemi:[0x9fb2ff,0x4a4060,.62],sun:[0xc2d0ff,.42],disc:[0xf4f1ff,-500,520,-2000,45],sea:0x1a6f8c,night:1,cloud:[0x3a4a78,0x2e3c66]}};
let NIGHT=0;
function applyTheme(n){const T=THEMES[n];skyU.top.value.setRGB(...T.top);skyU.bot.value.setRGB(...T.bot);FOG.color.setHex(T.fog);hemi.color.setHex(T.hemi[0]);hemi.groundColor.setHex(T.hemi[1]);hemi.intensity=T.hemi[2];sun.color.setHex(T.sun[0]);sun.intensity=T.sun[1];
  sunDisc.material.color.setHex(T.disc[0]);sunDisc.position.set(T.disc[1],T.disc[2],T.disc[3]);sunDisc.scale.setScalar(T.disc[4]/70);sunDisc.lookAt(0,0,0);stars.visible=T.night>.6;cloudM.color.setHex(T.cloud[0]);cloudS.color.setHex(T.cloud[1]);NIGHT=T.night;
  document.body.style.background='#'+new THREE.Color(...T.bot).getHexString();}

// world helpers (per level)
let world=null;
const add=o=>{world.add(o);return o;};
function box(w,h,d,mat,x,y,z,sh){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);if(sh)m.castShadow=true;m.receiveShadow=true;return add(m);}
function cyl(rt,rb,h,mat,x,y,z,seg){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||20),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m;}
function sideMat(col,rx,ry){const o={map:rep(winT,rx,ry)};if(NIGHT>0)Object.assign(o,{emissive:0xffcf6a,emissiveMap:rep(litT,rx,ry),emissiveIntensity:NIGHT*.9});return M(col,o);}
const PAL=[0xf6e3c6,0xf8cfae,0xd3ece6,0xf4f1ea,0xeac0a0,0xcfe2f3,0xf7dce4,0xe9e2b8];
function building(x,z0,z1,w,h,col,crenel){const d=z0-z1;const sx=sideMat(col,Math.max(1,Math.round(d/5)),Math.max(1,Math.round(h/4.5))),sz=sideMat(col,Math.max(1,Math.round(w/5)),Math.max(1,Math.round(h/4.5))),top=M(0xffffff,{map:rep(roofT,w/6,d/6)});
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[sx,sx,top,top,sz,sz]);m.position.set(x,h/2,(z0+z1)/2);m.receiveShadow=true;add(m);
  const pm=M(new THREE.Color(col).multiplyScalar(.9).getHex());
  if(crenel){const n=Math.floor(d/1.3),nw=Math.floor(w/1.3),im=new THREE.InstancedMesh(new THREE.BoxGeometry(.5,1,.7),pm,n*2+nw*2),o=new THREE.Object3D();let k=0;
    for(const sd of[-1,1])for(let i=0;i<n;i++){const t=i%2?.45:.85;o.rotation.y=0;o.position.set(x+sd*(w/2-.25),h+t/2,z0-.6-i*1.3);o.scale.set(1,t,1);o.updateMatrix();im.setMatrixAt(k++,o.matrix);}
    for(const zz of[z0-.25,z1+.25])for(let i=0;i<nw;i++){const t=i%2?.45:.85;o.position.set(x-w/2+.6+i*1.3,h+t/2,zz);o.rotation.y=Math.PI/2;o.scale.set(1,t,1);o.updateMatrix();im.setMatrixAt(k++,o.matrix);}
    im.count=k;im.castShadow=true;add(im);}

function renderLevels(){SAVE.un=lessons();$('levels').innerHTML=LEVELS.map((L,i)=>{const st=SAVE.st[i]||0,lock=i>=SAVE.un;
  return `<button class="lv" data-i="${i}" style="background:${L.col}" ${lock?'aria-disabled="true"':''}><span class="n">${i+1}</span><span class="t">${L.name}</span><span class="a" dir="rtl">${L.ar}</span><span class="s">${'★'.repeat(st)}<i>${'★'.repeat(3-st)}</i></span>${lock?`<span class="lock"><b>&#128274;</b>Get 8/10 in ${i+1} lesson${i?'s':''}<span dir="rtl">جاوب ٨ من ١٠ في ${['درس واحد','درسين','٣ دروس','٤ دروس'][i]}</span></span>`:''}</button>`;}).join('');}
$('levels').addEventListener('click',e=>{const b=e.target.closest('.lv');if(!b)return;const i=+b.dataset.i;if(i>=SAVE.un){b.animate&&b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:240});return;}play(i);});
renderLevels();

// UI helpers
function pop(t,ar,cls){const d=document.createElement('div');d.className='pop '+(cls||'');d.textContent=t;if(ar){const s=document.createElement('small');s.dir='rtl';s.textContent=ar;d.appendChild(s);}$('pops').appendChild(d);setTimeout(()=>d.remove(),1100);}
function flash(){const f=$('flash');f.style.transition='none';f.style.opacity=.9;requestAnimationFrame(()=>{f.style.transition='opacity .6s';f.style.opacity=0;});}

// state
let state='menu',mode='run',s=0,lat=0,y=30,vy=0,grounded=true,v=18,boost=0,hop=0,hopV=0,pearls=0,bumps=0,time=0,inv=0,shake=0,squash=1,latV=0,prevLat=0,camTh=0,endT=0,said={},trail=0;
const camP=new THREE.Vector3(0,36,12),camL=new THREE.Vector3(0,30,-20),up=new THREE.Vector3(0,1,0);
function reset(){mode='run';s=0;lat=0;y=hAt(SEG[0],0);vy=0;grounded=true;v=18;boost=0;hop=0;pearls=0;bumps=0;time=0;inv=0;said={};endT=0;scene.fog=FOG;pipeView(false);
  PEARLS.forEach(p=>{p.got=false;p.m.visible=true;p.m.scale.setScalar(1);});OBS.forEach(o=>{o.done=false;o.x=o.x0;o.g.rotation.x=0;o.g.rotation.z=0;o.g.position.set(o.x,o.y,-o.s);});GUNK.forEach(k=>k.done=false);rings.forEach(r=>r.done=false);
  up.set(0,1,0);$('pc').textContent=0;
  }
function play(i){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();
  if(i!==LVL||!world)buildLevel(i);reset();state='play';$('start').classList.add('hide');$('end').classList.add('hide');$('hud').classList.add('on');camP.set(0,y+6,12);
  pop('Level '+(i+1),LV.ar,'big');setTimeout(()=>state==='play'&&pop('GO!','يلا!'),900);tone(400,900,.25,'square',.06);}
function showMenu(){state='menu';renderLevels();$('end').classList.add('hide');$('start').classList.remove('hide');$('hud').classList.remove('on');mode='run';scene.fog=FOG;pipeView(false);s=0;y=hAt(SEG[0],0);lat=0;}
$('again').onclick=()=>play(LVL);$('menu').onclick=showMenu;$('next').onclick=()=>{if(LVL+1<LEVELS.length&&LVL+1<SAVE.un)play(LVL+1);else showMenu();};

// input
const keys={};addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump();}});addEventListener('keyup',e=>keys[e.code]=0);
let pd=null;
cvs.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,t:performance.now(),moved:0};});
addEventListener('pointermove',e=>{if(!pd)return;const dx=e.clientX-pd.x;pd.moved+=Math.abs(dx)+Math.abs(e.clientY-pd.y);pd.x=e.clientX;pd.y=e.clientY;if(state==='play')lat+=dx*(mode==='pipe'?22:15)/Math.min(innerWidth,700);});
addEventListener('pointerup',()=>{if(pd&&pd.moved<14&&performance.now()-pd.t<300)jump();pd=null;});
let airJ=0,flip=0;const MAXJ=3;
function airPuff(){const p=dugi.position.clone();for(let i=0;i<10;i++){const a=i/10*Math.PI*2;spawn(p,new THREE.Vector3(Math.cos(a)*5,-1.5,Math.sin(a)*5),0xffffff,.4,.12,0);}}
function jump(){if(state!=='play')return;
  if(mode==='run'){if(grounded){vy=10;grounded=false;airJ=0;squash=1.25;tone(330,720,.18,'square',.05);}
    else if(airJ<MAXJ){airJ++;vy=Math.max(vy,0)+8.5;squash=1.3;flip=1;airPuff();tone(330+airJ*180,720+airJ*300,.18,'square',.05);pop(['','Higher!','Even higher!','SUPER JUMP!'][airJ],['','أعلى!','أعلى وأعلى!','نطّة خارقة!'][airJ]);}}
  else{if(hop<=0){hopV=7;hop=.01;airJ=0;tone(330,720,.18,'square',.05);}else if(airJ<2){airJ++;hopV=Math.max(hopV,0)+5;flip=1;airPuff();tone(330+airJ*180,720+airJ*300,.18,'square',.05);}}}

function collect(p){p.got=true;pearls++;$('pc').textContent=pearls;tone(1046,1568,.12,'sine',.08);const wp=p.m.getWorldPosition(new THREE.Vector3());p.m.visible=false;for(let i=0;i<5;i++)spawn(wp,new THREE.Vector3((rnd()-.5)*5,3+rnd()*3,(rnd()-.5)*5),0xfff1a8,.35,.06,.3);}
function hit(o){o.done=true;if(o.boost){boost=14;pop('Slippery!','زلق!');hiss(.5,.25,2400);burst(dugi.position.clone().setY(dugi.position.y+1),12,0xffffff,8,.3);return;}
  if(inv>0)return;inv=1.2;bumps++;v*=.55;shake=.6;tone(220,70,.3,'sawtooth',.08);const lost=Math.min(3,pearls);pearls-=lost;$('pc').textContent=pearls;
  for(let i=0;i<lost;i++)spawn(dugi.position.clone().setY(dugi.position.y+1.2),new THREE.Vector3((rnd()-.5)*10,8,(rnd()-.5)*6),0xfff3f6,1,.3);
  burst(dugi.position.clone().setY(dugi.position.y+2),10,0xffd24a,7,.2);if(o.type!=='gunk'&&o.type!=='bus'&&o.type!=='car'){o.g.rotation.z=(o.x>lat?1:-1)*.5;o.g.position.y+=.4;}
  const T={duck:['Squeak!','كواك!'],cat:['Meow!','مياو!'],gunk:['Slimy!','لزج!'],car:['Beep beep!','بيب بيب!'],bus:['Bonk!','أوه!']}[o.type]||['Bonk!','أوه!'];pop(T[0],T[1]);if(o.type==='duck')tone(1200,900,.2,'square',.05);if(o.type==='cat')tone(700,1100,.25,'triangle',.06);}
function pipeView(on){for(const c of world.children)c.visible=on?c===world.userData.pipe:c!==world.userData.pipe;}
function enterPipe(){mode='pipe';pipeView(true);s=PIPE.s0;lat=0;hop=0;camTh=0;world.userData.pipe.visible=true;scene.fog=FOGPIPE;FOGPIPE.color.setHex([0x0a3346,0x4a2410,0x3a1430,0x1a1450][LVL]);flash();pop('WHOOSH!','ووووش!');hiss(.9,.35,500);boost=8;}
function exitPipe(){const th=lat/RR,c=Cp(PIPE.L);mode='run';lat=clamp(c.x+Math.sin(th)*RR,-6,6);y=c.y-Math.cos(th)*RR+.2;vy=8;grounded=false;pipeView(false);scene.fog=FOG;flash();pop('THE SEA!','البحر!');}
function respawn(){const nx=SEG.find(g=>g.a>s);if(!nx)return;s=nx.a+3;y=hAt(nx,s);lat=0;vy=0;grounded=true;v=18;const lost=Math.min(5,pearls);pearls-=lost;$('pc').textContent=pearls;bumps++;flash();pop('Oops!','أووبس!');}
function launch(pg){grounded=false;squash=1.2;airJ=0;
  if(pg&&pg.aim){const t=Math.max(.35,(pg.aim.s-s)/v);vy=clamp((pg.aim.y-y+.5*G*t*t)/t,6,18);if(!said.wee){said.wee=1;pop('WHEEE!','ويييي!');}}
  else{vy=pg&&pg.kick||10.5;const k='j'+Math.round(s);if(!said[k]&&!(pg&&pg.awn)){said[k]=1;pop('JUMP!','نط!');}else if(pg&&pg.awn)tone(520,880,.1,'triangle',.04);}}

function update(dt){time+=dt;inv-=dt;
  const kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);lat+=kx*dt*(mode==='pipe'?11:13);
  const g0=segAt(s),tgt=(mode==='pipe'?35:g0&&g0.sea?25:g0&&g0.room?24:g0&&g0.street?27:g0&&g0.chute?32:28)+LV.diff*.8;v+=(tgt+boost-v)*dt*.7;boost*=Math.pow(.25,dt);
  if(mode==='run'){
    const ps=s;s+=v*dt;
    if(PIPE&&s>=PIPE.s0-1.6&&s<PIPE.s0+12&&Math.abs(y-PIPE.entryY)<6){enterPipe();return;}
    const g=segAt(s);
    if(grounded){if(!g)launch(segAt(ps));
      else{y=hAt(g,s);if(g.kicks)for(const k of g.kicks)if(ps<k&&s>=k){grounded=false;vy=g.kv;squash=1.2;pop(g.sea?'SURF UP!':'RAMP!',g.sea?'موجة!':'قفزة!');hiss(.4,.2,1600);}}}
    else{vy-=G*dt;y+=vy*dt;if(g&&g.room&&y>hAt(g,s)+11){y=hAt(g,s)+11;vy=Math.min(vy,0);}
      if(g&&vy<=0&&y<=hAt(g,s)&&y>hAt(g,s)-3){y=hAt(g,s);grounded=true;airJ=0;squash=.62;shake=Math.max(shake,.18);
        if(g.sea){burst(new THREE.Vector3(lat,g.h+.4,-s),16,0xe8fbff,10,.16,1.2);hiss(.6,.35,700);if(!said.splash){said.splash=1;pop('SPLASH!','طشششش!');}}else{burst(new THREE.Vector3(lat,y+.2,-s),6,0xffffff,6,.14);tone(160,90,.12,'sine',.1);}}
      if(SEA&&s<SEA.a&&!(PIPE&&s>PIPE.s0)&&(g?y<hAt(g,s)-3:y<1))respawn();}
    const lw=g?g.w:5.2;lat=clamp(lat,-lw,lw);
    if(g&&g.room&&s>g.b-12){lat*=Math.pow(.02,dt);if(!said.tl){said.tl=1;pop('THE TOILET?!','الحمّام؟!');}}
    if(g&&g.street&&s>g.b-10&&!said.dr){said.dr=1;pop('THE DRAIN?!','المجاري؟!');}
    if(s>=FIN&&state==='play')finish();
    const gH=g?hAt(g,s):-99;
    for(const o of OBS){if(o.done||Math.abs(o.s-s)>o.d/2+.9)continue;if(Math.abs(lat-o.x)<o.w/2+.85&&y-gH<o.h-.2)hit(o);}
    for(const p of PEARLS){if(p.got||p.th!==undefined||Math.abs(p.s-s)>1.4)continue;if(Math.abs(lat-p.x)<1.45&&Math.abs(y+.9-p.y)<1.7)collect(p);}
    trail-=dt;if(grounded&&g&&trail<0){trail=g.sea?.03:.06;const col=g.sea?0xe8fbff:0xffffff;for(const sd of[-1,1])spawn(new THREE.Vector3(lat+sd*.8,y+.15,-s+1.2),new THREE.Vector3(sd*3+(rnd()-.5)*2,1.5+rnd()*2,4),col,g.sea?.4:.3,g.sea?.13:.07);}
  }else{
    s+=v*dt;const u=s-PIPE.s0;lat-=Math.sin(lat/RR)*dt*2.6;
    if(hop>0){hopV-=22*dt;hop+=hopV*dt;if(hop<=0){hop=0;squash=.7;}}
    const th=lat/RR;
    for(const r of rings)if(!r.done&&u>r.u){r.done=true;boost=Math.min(boost+4,14);tone(660,990,.12,'triangle',.05);}
    for(const p of PEARLS){if(p.got||p.th===undefined||Math.abs(p.s-s)>1.4)continue;const d=Math.atan2(Math.sin(th-p.th),Math.cos(th-p.th));if(Math.abs(d)*RR<1.5&&hop<1.6)collect(p);}
    for(const k of GUNK){if(k.done||Math.abs(k.s-s)>1.3)continue;const d=Math.atan2(Math.sin(th-k.th),Math.cos(th-k.th));if(Math.abs(d)*RR<1.5&&hop<1.1)hit(k);}
    trail-=dt;if(trail<0){trail=.05;const c=Cp(u-.6);spawn(c.clone().add(new THREE.Vector3(Math.sin(th)*(RR+.6),-Math.cos(th)*(RR+.6),0)),new THREE.Vector3((rnd()-.5)*2,(rnd()-.5)*2,3),0x9ff4ff,.35,.07,0);}
    if(u>=PIPE.L)exitPipe();
  }
  latV=(lat-prevLat)/Math.max(dt,.001);prevLat=lat;}
function finish(){state='end';endT=0;pop('HOME!','البيت!');tone(523,1046,.5,'triangle',.08);setTimeout(()=>tone(659,1318,.5,'triangle',.08),180);setTimeout(()=>tone(784,1568,.7,'triangle',.08),360);
  const st=pearls/TOTAL>=.6?3:pearls/TOTAL>=.35?2:1;SAVE.un=lessons();SAVE.st[LVL]=Math.max(SAVE.st[LVL]||0,st);persist();const nx=LVL+1<LEVELS.length?LEVELS[LVL+1]:null;
  $('stars').innerHTML='★'.repeat(st)+'<i>'+'★'.repeat(3-st)+'</i>';$('rp').textContent=pearls+'/'+TOTAL;$('rt').textContent=time.toFixed(1)+'s';$('rb').textContent=bumps;
  $('unl').textContent=!nx?'You finished every level!':LVL+1<SAVE.un?'':'Get 8 out of 10 in another Darb lesson to open the next level!';$('next').style.display=LVL+1<LEVELS.length&&LVL+1<SAVE.un?'block':'none';}

const tmp=new THREE.Vector3(),tmp2=new THREE.Vector3();let last=performance.now(),T=0;
buildLevel(0);reset();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;T+=dt;
  if(state==='play')update(dt);music(dt);
  if(state==='end'){endT+=dt;v=Math.max(0,v-dt*30);s=Math.min(s+v*dt,FIN+2.2);y=hAt(SEA,s);lat*=Math.pow(.1,dt);if(endT>1.3&&$('end').classList.contains('hide')){$('end').classList.remove('hide');$('hud').classList.remove('on');}}
  flip=Math.max(0,flip-dt*2.2);const ud=dugi.userData,air=mode==='run'?!grounded:hop>0;squash=lerp(squash,1,1-Math.pow(.001,dt));
  dugi.scale.set(DS/Math.sqrt(squash),DS*squash,DS/Math.sqrt(squash));
  ud.fl.forEach((p,i)=>p.rotation.z=(i?-1:1)*(air?Math.sin(T*28)*.6:Math.sin(T*6)*.12+.15));ud.tail.rotation.x=Math.sin(T*(air?20:8))*.25;
  if(ud.eyes){eyePop=flip>0?1:Math.max(0,eyePop-dt*3);const k=eyePop*(.85+.15*Math.sin(T*40));ud.eyes.forEach((e,i)=>{e.scale.set(1+k*1.4,1+k*1.6,1+k*1.1);e.position.z=e.userData.z0-k*.45;e.rotation.z=k*Math.sin(T*30+i*2)*.35;if(e.children[1])e.children[1].position.set((i?1:-1)*.02+Math.sin(T*25+i)*.05*k,.02+Math.cos(T*23+i)*.05*k,-.16);});}
  const y0=hAt(SEG[0],0);
  if(mode==='run'){dugi.position.set(lat,y,-s);dugi.rotation.set((air?clamp(-vy*.03,-.4,.4):0)-(1-flip)*(flip>0?Math.PI*2:0),clamp(-latV*.012,-.35,.35),clamp(-latV*.02,-.4,.4)+(grounded?Math.sin(T*9)*.04:0));
    if(state==='menu'){dugi.position.set(0,y0,-2);dugi.rotation.set(0,Math.sin(T*.8)*.4,Math.sin(T*3)*.05);}
    if(state==='end'){dugi.rotation.y=Math.sin(endT*6)*.2;dugi.position.y=y+Math.abs(Math.sin(endT*7))*.8;}}
  else{const u=s-PIPE.s0,th=lat/RR,c=Cp(u);dugi.position.set(c.x+Math.sin(th)*(RR-hop),c.y-Math.cos(th)*(RR-hop),c.z);dugi.rotation.set(0,clamp(-latV*.01,-.3,.3),th);}
  dugi.visible=!(inv>0&&Math.floor(T*16)%2);
  mama.position.y=(mama.userData.y||0)+Math.sin(T*2)*.15;mama.rotation.z=Math.sin(T*1.5)*.06;
  if(state==='menu'){const a=T*.25;camP.set(Math.sin(a)*7,y0+4+Math.sin(T*.5),-2+Math.cos(a)*7);camL.set(0,y0+.8,-2);up.set(0,1,0);}
  else if(state==='end'){const a=endT*.5;tmp.set(Math.sin(a)*12,SEA.h+6+endT*.6,-s+Math.cos(a)*12+4);camP.lerp(tmp,1-Math.pow(.05,dt));camL.lerp(tmp2.set(0,SEA.h+2,-s-3),1-Math.pow(.01,dt));up.set(0,1,0);}
  else if(mode==='run'){const g=segAt(s),rm=g&&g.room;tmp.set(lat*.7,y+(rm?4.2:4.6),-(s-(rm?8:9.5)));camP.lerp(tmp,1-Math.pow(rm?1e-6:1e-5,dt));camP.y=Math.max(lerp(camP.y,tmp.y,1-Math.pow(.006,dt)),tmp.y-1.6);
    camL.lerp(tmp2.set(lat*.85,y+1.3,-(s+14)),1-Math.pow(1e-6,dt));up.lerp(tmp2.set(0,1,0),1-Math.pow(.01,dt)).normalize();}
  else{const u=s-PIPE.s0,th=lat/RR;camTh=lerp(camTh,th,1-Math.pow(1e-4,dt));const dir=tmp2.set(Math.sin(camTh),-Math.cos(camTh),0);
    camP.copy(Cp(u-6.5)).addScaledVector(dir,RR*.3);camL.copy(Cp(u+10)).addScaledVector(dir,RR*.25);up.copy(dir).negate();}
  shake=Math.max(0,shake-dt*1.6);cam.position.copy(camP).add(tmp.set((rnd()-.5)*shake,(rnd()-.5)*shake,0));cam.up.copy(up);cam.lookAt(camL);
  const fov=68+(state==='play'?(v-22)*.75+boost*.6:0);cam.fov=lerp(cam.fov,clamp(fov,60,96),1-Math.pow(.02,dt));cam.updateProjectionMatrix();
  sky.position.copy(cam.position);stars.position.copy(cam.position);
  sun.position.copy(dugi.position).add(tmp.set(25,45,18));sun.target.position.copy(dugi.position);
  for(const p of PEARLS)if(!p.got&&Math.abs(p.s-s)<160){p.m.rotation.y+=dt*3;p.m.scale.setScalar(1+Math.sin(T*5+p.s)*.08);}
  for(const o of OBS)if(o.mv){o.x+=o.mv*dt;if(o.x>18)o.x=-18;if(o.x<-18)o.x=18;o.g.position.x=o.x;}
  for(const k of GUNK)if(Math.abs(k.s-s)<80)k.g.scale.y=.55+Math.sin(T*6+k.s)*.08;
  for(const c of cars){c.g.position.x+=c.v*dt;if(c.g.position.x>220)c.g.position.x=-220;if(c.g.position.x<-220)c.g.position.x=220;c.g.rotation.y=c.v>0?0:Math.PI;}
  for(const d of boats){d.position.y=d.userData.h+Math.sin(T*1.2+d.position.x)*.3;d.rotation.z=Math.sin(T+d.position.z)*.06;}
  if(seaMesh&&(cam.position.z<-(LANDEND-80)||state==='menu')){const a=seaMesh.geometry.attributes.position.array;for(let i=0;i<a.length;i+=3)a[i+1]=Math.sin(seaBase[i]*.06+T*1.6)*.22+Math.cos(seaBase[i+2]*.08+T*1.2)*.22;seaMesh.geometry.attributes.position.needsUpdate=true;}
  for(const q of PT){if(q.life<=0)continue;q.life-=dt;if(q.life<=0){q.m.visible=false;continue;}q.v.y-=9*q.g*dt;q.m.position.addScaledVector(q.v,dt);q.m.scale.setScalar(q.sz*(.4+q.life/q.max));q.m.material.opacity=Math.min(1,q.life/q.max*2);}
  if(state==='play'){const f=clamp(s/FIN,0,1);$('pb').style.width=(f*100)+'%';$('dot').style.left=(f*100)+'%';}
  R.render(scene,cam);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
}
</script>
